    <title>తెలుగు పంచాంగం - Telugu Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .header h1 {
            color: #764ba2;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .date-picker {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .date-picker label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }

        .date-picker input {
            width: 100%;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .date-picker input:focus {
            border-color: #764ba2;
        }

        .calendar-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .current-date {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .current-date h2 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .current-date p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .panchang-grid {
            display: grid;
            gap: 15px;
        }

        .panchang-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .panchang-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            cursor: pointer;
        }

        .panchang-item .info-icon {
            float: right;
            color: #667eea;
            font-size: 1.2em;
            opacity: 0.7;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: slideUp 0.3s;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #764ba2;
            margin-bottom: 5px;
        }

        .modal-header .telugu-title {
            color: #667eea;
            font-size: 1.3em;
            font-weight: bold;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2em;
            color: #999;
            cursor: pointer;
            line-height: 1;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .modal-section p {
            line-height: 1.6;
            color: #555;
            margin-bottom: 10px;
        }

        .modal-section ul {
            margin-left: 20px;
            line-height: 1.8;
        }

        .modal-section li {
            color: #555;
            margin-bottom: 8px;
        }

        .significance-tag {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .panchang-item .label {
            font-size: 0.85em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .panchang-item .value {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .panchang-item .telugu {
            font-size: 1.1em;
            color: #764ba2;
            margin-top: 3px;
        }

        .panchang-item .timing {
            font-size: 0.9em;
            color: #ff6b6b;
            margin-top: 5px;
            font-weight: 600;
        }

        .panchang-item .timing-range {
            font-size: 0.85em;
            color: #28a745;
            margin-top: 3px;
        }

        .next-element {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px dashed #e0e0e0;
        }

        .next-element .next-label {
            font-size: 0.8em;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .next-element .next-value {
            font-size: 1em;
            font-weight: bold;
            color: #555;
        }

        .next-element .next-telugu {
            font-size: 0.95em;
            color: #9b59b6;
            margin-top: 2px;
        }

        .next-element .next-timing {
            font-size: 0.85em;
            color: #3498db;
            margin-top: 3px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 0.9em;
            opacity: 0.8;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .current-date h2 {
                font-size: 1.2em;
            }

            .panchang-item {
                padding: 12px;
            }
        }
    </style>
</head>

        // Calculate Telugu calendar details based on date
        function calculatePanchang(date) {
            const dayOfYear = getDayOfYear(date);
            const year = date.getFullYear();
            const month = date.getMonth();
            const day = date.getDate();
            const weekday = date.getDay();
            
            // Telugu year calculation (approximate)
            const teluguYear = year + 3100; // Approximate Kali year
            
            // Determine paksha and thithi
            const moonPhase = (dayOfYear * 12.368) % 30; // Approximate lunar day
            const thithiIndex = Math.floor(moonPhase);
            const paksha = moonPhase < 15 ? 'శుక్ల పక్షం' : 'కృష్ణ పక్షం';
            const pakshaEng = moonPhase < 15 ? 'Shukla Paksha (Waxing)' : 'Krishna Paksha (Waning)';
            
            // Get thithi
            let adjustedThithiIndex = Math.floor(moonPhase) % 15;
            if (adjustedThithiIndex === 14 && moonPhase >= 14.5 && moonPhase < 15) {
                adjustedThithiIndex = 14; // Pournami
            } else if (adjustedThithiIndex === 14 && moonPhase >= 29.5) {
                adjustedThithiIndex = 15; // Amavasya
            }
            const thithi = thidhiNames[adjustedThithiIndex];
            const thithiTiming = calculateTiming(moonPhase, 'thithi');
            
            // Calculate next thithi if current ends today
            let nextThithi = null;
            if (thithiTiming.endsToday) {
                const nextThithiIndex = (adjustedThithiIndex + 1) % 16;
                nextThithi = {
                    ...thidhiNames[nextThithiIndex],
                    startTime: thithiTiming.end,
                    index: nextThithiIndex
                };
            }
            
            // Calculate Nakshatra (27 divisions)
            const nakshatraValue = (dayOfYear * 13.176) % 27;
            const nakshatraIndex = Math.floor(nakshatraValue);
            const nakshatra = nakshatraNames[nakshatraIndex];
            const nakshatraTiming = calculateTiming(nakshatraValue, 'nakshatra');
            
            // Calculate next nakshatra if current ends today
            let nextNakshatra = null;
            if (nakshatraTiming.endsToday) {
                const nextNakshatraIndex = (nakshatraIndex + 1) % 27;
                nextNakshatra = {
                    ...nakshatraNames[nextNakshatraIndex],
                    startTime: nakshatraTiming.end,
                    index: nextNakshatraIndex
                };
            }
            
            // Calculate Yogam
            const yogamValue = (dayOfYear * 7.89) % 27;
            const yogamIndex = Math.floor(yogamValue);
            const yogam = yogamNames[yogamIndex];
            const yogamTiming = calculateTiming(yogamValue, 'yogam');
            
            // Calculate next yogam if current ends today
            let nextYogam = null;
            if (yogamTiming.endsToday) {
                const nextYogamIndex = (yogamIndex + 1) % 27;
                nextYogam = {
                    ...yogamNames[nextYogamIndex],
                    startTime: yogamTiming.end,
                    index: nextYogamIndex
                };
            }
            
            // Calculate Karanam (11 divisions, repeated)
            const karanamValue = (dayOfYear * 5.5) % 11;
            const karanamIndex = Math.floor(karanamValue);
            const karanam = karanamNames[karanamIndex];
            const karanamTiming = calculateTiming(karanamValue, 'karanam');

                    startTime: karanamTiming.end,
                    index: nextKaranamIndex
                };

            // Calculate Rashi (zodiac sign based on month)
            const rashiIndex = Math.floor((month + 9) % 12);
            const rashi = rashiNames[rashiIndex];
            
            // Determine Telugu month
            const teluguMonthIndex = (month + 10) % 12; // Approximate mapping

        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        // Calculate timing for panchang elements
        function calculateTiming(baseValue, elementType) {
            // Calculate when the element starts and ends during the day
            const fractionalPart = baseValue % 1;
            
            let startHour, startMin, endHour, endMin;
            let endsToday = false;
            
            if (elementType === 'thithi') {
                // Thithi can span across days, calculate when current thithi ends
                const remainingFraction = 1 - fractionalPart;
                const durationHours = remainingFraction * 24;
                
                startHour = 6; // Starts from sunrise (approx)
                startMin = 15;
                
                endHour = Math.floor(startHour + durationHours);
                endMin = Math.floor((durationHours % 1) * 60);
                
                if (endHour < 24) {
                    endsToday = true;
                } else {
                    endHour -= 24;
                }
            } else if (elementType === 'nakshatra') {
                // Nakshatra timing
                const nakshatraDuration = 13.33; // Average hours per nakshatra
                const elapsedHours = fractionalPart * nakshatraDuration;
                
                startHour = 6;
                startMin = 15;
                
                endHour = Math.floor(startHour + nakshatraDuration - elapsedHours);
                endMin = Math.floor(((nakshatraDuration - elapsedHours) % 1) * 60);
                
                if (endHour < 24) {
                    endsToday = true;
                } else {
                    endHour -= 24;
                }
            } else if (elementType === 'yogam') {
                // Yogam timing - changes less frequently
                const yogamDuration = 18; // Approximate hours
                const elapsedHours = fractionalPart * yogamDuration;
                
                startHour = Math.floor(6 + (fractionalPart * 8));
                startMin = Math.floor((fractionalPart * 8 % 1) * 60);
                
                endHour = Math.floor(startHour + yogamDuration - elapsedHours);
                endMin = Math.floor(((yogamDuration - elapsedHours) % 1) * 60);
                
                if (endHour < 24) {
                    endsToday = true;
                } else {
                    endHour -= 24;
                }
            } else if (elementType === 'karanam') {
                // Karanam - half of thithi
                const karanamDuration = 6; // Approximate hours
                const elapsedHours = fractionalPart * karanamDuration;
                
                startHour = Math.floor(6 + (fractionalPart * 12));
                startMin = Math.floor((fractionalPart * 12 % 1) * 60);
                
                endHour = Math.floor(startHour + karanamDuration - elapsedHours);
                endMin = Math.floor(((karanamDuration - elapsedHours) % 1) * 60);
                
                if (endHour < 24) {
                    endsToday = true;
                }
            } else {
                // Default timing (all day)
                return {
                    start: '06:15 AM',
                    end: '06:30 PM',
                    endsToday: false,
                    ongoing: true
                };
            }
            
            return {
                start: formatTime(startHour, startMin),
                end: formatTime(endHour, endMin),
                endsToday: endsToday,
                ongoing: true
            };
        }

        function formatTime(hour, minute) {
            let period = 'AM';
            let displayHour = hour;
            
            if (hour >= 12) {
                period = 'PM';
                if (hour > 12) displayHour = hour - 12;
            }
            if (hour === 0) displayHour = 12;
            
            const displayMinute = minute.toString().padStart(2, '0');
            return `${displayHour}:${displayMinute} ${period}`;
        }

        function displayPanchang(date) {
            const panchang = calculatePanchang(date);
            
            // Update date displays
            const englishDateStr = `${weekdaysEnglish[date.getDay()]}, ${englishMonths[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
            const teluguDateStr = `${panchang.weekdayTelugu}, ${panchang.teluguMonth} ${panchang.teluguYear}`;
            
            document.getElementById('englishDate').textContent = englishDateStr;
            document.getElementById('teluguDate').textContent = teluguDateStr;
            
            // Helper function to generate next element HTML
            const getNextElementHTML = (nextElement, type) => {
                if (!nextElement) return '';
                return `
                    <div class="next-element">
                        <div class="next-label">⏭️ Next ${type}</div>
                        <div class="next-value">${nextElement.english}</div>
                        <div class="next-telugu">${nextElement.telugu}</div>
                        <div class="next-timing">🕐 Starts at: ${nextElement.startTime}</div>
                    </div>
                `;
            };
            
            // Create panchang items with click handlers
            const panchangData = document.getElementById('panchangData');
            panchangData.innerHTML = `
                <div class="panchang-item">
                    <div class="label">Paksha / పక్షం</div>
                    <div class="value">${panchang.pakshaEng}</div>
                    <div class="telugu">${panchang.paksha}</div>
                </div>
                
                <div class="panchang-item" onclick='showInfo("thithi", ${Math.floor((getDayOfYear(date) * 12.368) % 30) % 15})'>
                    <div class="label">Thithi / తిథి <span class="info-icon">ℹ️</span></div>
                    <div class="value">${panchang.thithi.english}</div>
                    <div class="telugu">${panchang.thithi.telugu}</div>
                    <div class="timing">⏰ Until: ${panchang.thithiTiming.end}${panchang.thithiTiming.endsToday ? '' : ' (Next day)'}</div>
                    <div class="timing-range">Available from: ${panchang.thithiTiming.start}</div>
                    ${getNextElementHTML(panchang.nextThithi, 'Thithi')}
                </div>
                
                <div class="panchang-item" onclick='showInfo("nakshatra", ${Math.floor((getDayOfYear(date) * 13.176) % 27)})'>
                    <div class="label">Nakshatra / నక్షత్రం <span class="info-icon">ℹ️</span></div>
                    <div class="value">${panchang.nakshatra.english}</div>
                    <div class="telugu">${panchang.nakshatra.telugu}</div>
                    <div class="timing">⏰ Until: ${panchang.nakshatraTiming.end}${panchang.nakshatraTiming.endsToday ? '' : ' (Next day)'}</div>
                    <div class="timing-range">Available from: ${panchang.nakshatraTiming.start}</div>
                    ${getNextElementHTML(panchang.nextNakshatra, 'Nakshatra')}
                </div>
                
                <div class="panchang-item" onclick='showInfo("yogam", ${Math.floor((getDayOfYear(date) * 7.89) % 27)})'>
                    <div class="label">Yogam / యోగం <span class="info-icon">ℹ️</span></div>
                    <div class="value">${panchang.yogam.english}</div>
                    <div class="telugu">${panchang.yogam.telugu}</div>
                    <div class="timing">⏰ Until: ${panchang.yogamTiming.end}${panchang.yogamTiming.endsToday ? '' : ' (Next day)'}</div>
                    <div class="timing-range">Available from: ${panchang.yogamTiming.start}</div>
                    ${getNextElementHTML(panchang.nextYogam, 'Yogam')}
                </div>
                
                <div class="panchang-item" onclick='showInfo("karanam", ${Math.floor((getDayOfYear(date) * 5.5) % 11)})'>
                    <div class="label">Karanam / కరణం <span class="info-icon">ℹ️</span></div>
                    <div class="value">${panchang.karanam.english}</div>
                    <div class="telugu">${panchang.karanam.telugu}</div>
                    <div class="timing">⏰ Until: ${panchang.karanamTiming.end}${panchang.karanamTiming.endsToday ? '' : ' (Next day)'}</div>
                    <div class="timing-range">Available from: ${panchang.karanamTiming.start}</div>
                    ${getNextElementHTML(panchang.nextKaranam, 'Karanam')}
                </div>
                
                <div class="panchang-item" onclick='showInfo("rashi", ${Math.floor((date.getMonth() + 9) % 12)})'>
                    <div class="label">Rashi / రాశి <span class="info-icon">ℹ️</span></div>
                    <div class="value">${panchang.rashi.english}</div>
                    <div class="telugu">${panchang.rashi.telugu}</div>
                    <div class="timing-range">All day</div>
                </div>
                
                <div class="panchang-item">
                    <div class="label">Sunrise / సూర్యోదయం</div>
                    <div class="value">${panchang.sunrise}</div>
                </div>
                
                <div class="panchang-item">
                    <div class="label">Sunset / సూర్యాస్తమయం</div>
                    <div class="value">${panchang.sunset}</div>
                </div>
            `;
        }

        // Show detailed information modal
        function showInfo(type, index) {
            const modal = document.getElementById('infoModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalTeluguTitle = document.getElementById('modalTeluguTitle');
            const modalBody = document.getElementById('modalBody');
            
            let info, title, teluguTitle;
            
            switch(type) {
                case 'thithi':
                    info = thithiInfo[index];
                    title = thidhiNames[index].english;
                    teluguTitle = thidhiNames[index].telugu;
                    break;
                case 'nakshatra':
                    info = nakshatraInfo[index];
                    title = nakshatraNames[index].english;
                    teluguTitle = nakshatraNames[index].telugu;
                    break;
                case 'yogam':
                    info = yogamInfo[index];
                    title = yogamNames[index].english;
                    teluguTitle = yogamNames[index].telugu;
                    break;
                case 'karanam':
                    info = karanamInfo[index];
                    title = karanamNames[index].english;
                    teluguTitle = karanamNames[index].telugu;
                    break;
                case 'rashi':
                    info = rashiInfo[index];
                    title = rashiNames[index].english;
                    teluguTitle = rashiNames[index].telugu;
                    break;
            }
            
            modalTitle.textContent = title;
            modalTeluguTitle.textContent = teluguTitle;
            
            // Build modal content based on type
            let content = '';
            
            if (type === 'thithi' || type === 'nakshatra') {
                content = `
                    <div class="modal-section">
                        <h3>📖 Meaning</h3>
                        <p>${info.meaning}</p>
                    </div>
                    
                    <div class="modal-section">
                        <h3>✨ Significance</h3>
                        <ul>
                            ${info.significance.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                    
                    <div class="modal-section">
                        <h3>🕉️ Deity</h3>
                        <p>${info.deity}</p>
                    </div>
                    
                    ${info.activities ? `
                    <div class="modal-section">
                        <h3>🎯 Recommended Activities</h3>
                        <p>${info.activities}</p>
                    </div>
                    ` : ''}
                    
                    ${info.nature ? `
                    <div class="modal-section">
                        <h3>🌟 Nature</h3>
                        <p>${info.nature}</p>
                    </div>
                    ` : ''}
                    
                    ${info.element ? `
                    <div class="modal-section">
                        <h3>🌍 Element</h3>
                        <p>${info.element}</p>
                    </div>
                    ` : ''}
                    
                    ${info.characteristics ? `
                    <div class="modal-section">
                        <h3>💫 Characteristics</h3>
                        <p>${info.characteristics}</p>
                    </div>
                    ` : ''}
                    
                    <div class="modal-section">
                        <h3>📜 Historical Significance</h3>
                        <p>${info.historical}</p>
                    </div>
                `;
            } else if (type === 'rashi') {
                content = `
                    <div class="modal-section">
                        <h3>📖 Meaning</h3>
                        <p>${info.meaning}</p>
                    </div>
                    
                    <div class="modal-section">
                        <h3>💫 Characteristics</h3>
                        <p>${info.characteristics}</p>
                    </div>
                    
                    <div class="modal-section">
                        <h3>💕 Compatibility</h3>
                        <p>${info.compatibility}</p>
                    </div>
                    
                    <div class="modal-section">
                        <h3>🕉️ Associated Deity</h3>
                        <p>${info.deity}</p>
                    </div>
                `;
            } else {
                // For Yogam and Karanam
                content = `
                    <div class="modal-section">
                        <h3>📖 Meaning</h3>
                        <p>${info.meaning}</p>
                    </div>
                    
                    <div class="modal-section">
                        <h3>✨ Significance</h3>
                        <ul>
                            ${info.significance.map(item => `<li>${item}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            modalBody.innerHTML = content;
            modal.classList.add('active');
        }

        // Close modal
        function closeModal() {
            const modal = document.getElementById('infoModal');
            modal.classList.remove('active');
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('infoModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Initialize on page load
        function init() {
            const today = new Date();
            const dateInput = document.getElementById('dateInput');
            
            // Set today's date as default
            dateInput.valueAsDate = today;
            
            // Display panchang for today
            displayPanchang(today);
            
            // Add event listener for date changes
            dateInput.addEventListener('change', (e) => {
                const selectedDate = new Date(e.target.value + 'T00:00:00');
                displayPanchang(selectedDate);
            });
        }

        // Run on page load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
